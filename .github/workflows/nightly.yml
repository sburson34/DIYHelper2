name: Nightly extended

# Extended suite. Runs once per night on main. Intended for checks that are
# too slow or too flaky-prone to run on every push — flaky detection via
# repeat runs, dependency drift check, and a publish-deploy dry run.

on:
  # schedule cron disabled pre-launch — re-enable at launch
  # (saves live-contract API calls against Anthropic + OpenAI)
  # schedule:
  #   - cron: '0 7 * * *'   # 07:00 UTC = 03:00 ET
  workflow_dispatch:

jobs:
  flaky-detect-frontend:
    name: Flaky detect (Jest x3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Run Jest 3 times in a row
        # A single flake can be masked by retry-on-fail runners. Running the
        # same suite back-to-back in one job exposes tests that depend on
        # ordering, stale globals, or timer races.
        run: |
          for i in 1 2 3; do
            echo "=== Jest run #$i ==="
            npm test -- --ci || exit 1
          done

  flaky-detect-backend:
    name: Flaky detect (xUnit x3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - run: dotnet restore DIYHelper2.slnx

      - name: Run xUnit 3 times in a row
        run: |
          for i in 1 2 3; do
            echo "=== xUnit run #$i ==="
            dotnet test DIYHelper2.slnx --logger "console;verbosity=minimal" || exit 1
          done

  live-contract:
    name: Live contract suite (Anthropic + OpenAI vision)
    runs-on: ubuntu-latest
    # Don't fail the nightly if a provider rate-limits us or has a brief
    # outage — the rest of the nightly should still go green.
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_LIVE_CONTRACT: 'true'
      OPENAI_API_KEY: ${{ secrets.LIVE_OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.LIVE_ANTHROPIC_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - run: dotnet restore DIYHelper2.slnx

      - name: Run live contract suite
        # The LiveContractFactAttribute auto-skips tests whose RequiredEnv is
        # not set, so a partial-secret config still surfaces useful coverage.
        # Estimated cost per run: <$0.01 across both providers (1×1 PNG +
        # single-token "OK" reply on Claude Haiku + GPT-4o).
        run: >
          dotnet test DIYHelper2.Tests.Live/DIYHelper2.Tests.Live.csproj
          --configuration Release
          --logger "console;verbosity=normal"

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: npm audit (app)
        working-directory: app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high --omit=dev

      - name: dotnet vulnerable packages (backend)
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet restore DIYHelper2.slnx
          OUTPUT=$(dotnet list DIYHelper2.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "has the following vulnerable packages"; then
            echo "::error::dotnet reported vulnerable NuGet packages in backend"
            exit 1
          fi
