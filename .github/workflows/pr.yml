name: PR validation

# Pre-launch cost control: CI fires only on PR open / ready_for_review /
# reopened — fixup pushes during a PR do NOT retrigger, and push to main
# does NOT retrigger. Rerun manually via
# `gh workflow run "PR validation" --ref <branch>` or close+reopen the
# PR. Re-add the synchronize + push triggers before going to prod so
# main regressions are caught automatically.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  # One run per ref — cancel older runs of the same branch when a new push arrives.
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + unit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install
        env:
          # Read by app/.npmrc to authenticate to GHCR for the public
          # @sburson34/mobile-shared package. GitHub's npm endpoint
          # requires auth even on public packages.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Lint
        # Hard gate: errors fail the job. Warnings are surfaced but don't
        # block (the codebase has a baseline of ~160 pre-existing warnings,
        # mostly stylistic, to work down over time). Raise --max-warnings
        # once the warning baseline drops.
        run: npm run lint -- --max-warnings=200

      - name: Test
        run: npm test -- --ci --reporters=default --reporters=github-actions
        env:
          CI: 'true'

  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Repo targets net10.0 which is still in preview channels during
          # the 2026 window. If this step fails with "SDK not found", bump
          # to the latest 10.0.x-rc or use dotnet-version: '10.x' once GA.
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        env:
          # Read by ../nuget.config for the public Sburson.Shared.Backend
          # feed. GitHub's NuGet endpoint always requires auth even on
          # public packages; the auto-issued token has packages:read.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore DIYHelper2.slnx

      - name: Build (no restore)
        run: dotnet build DIYHelper2.slnx --no-restore --configuration Release

      - name: Test
        # Only the fast unit + integration project here. DIYHelper2.Tests.Live
        # makes real OpenAI / Anthropic calls and lives in nightly.yml's
        # live-contract job; its tests would skip on a PR anyway (the
        # LiveContractFactAttribute auto-skips without RUN_LIVE_CONTRACT)
        # but pointing at the single project is faster and unambiguous.
        run: >
          dotnet test DIYHelper2.Tests/DIYHelper2.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

# Dependency vulnerability scan moved to nightly.yml. Deps rarely change
# between commits, so per-PR scans mostly burned minutes confirming the
# same baseline. Nightly cron + workflow_dispatch is the new cadence.
